<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toán Chuyên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sidebar-w:310px;
      --text:#1a2332;
      --text-light:#6b7a8f;
      --text-muted:#94a3b8;
      --border:#eaedf2;
      --bg:#f4f6fb;
    }
    html,body{height:100%}
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#c4cad5;border-radius:4px}

    /* ===== HEADER ===== */
    .header{
      flex-shrink:0;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      z-index:100;
    }
    .header-main{
      display:flex;align-items:center;
      height:56px;padding:0 16px;gap:12px;
    }
    .brand{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:default}
    .brand .bi{
      width:30px;height:30px;
      background:linear-gradient(135deg,#f1c40f,#f39c12);
      border-radius:7px;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;color:#fff;
    }
    .brand h1{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
    .brand h1 span{color:#f1c40f}
    .sec-tabs{display:flex;overflow-x:auto;gap:1px;flex:1;scrollbar-width:none;justify-content:flex-end}
    .sec-tabs::-webkit-scrollbar{display:none}
    .sec-tab{
      flex-shrink:0;padding:6px 10px;border:none;background:transparent;
      font-size:11.5px;font-weight:500;color:var(--text-light);
      cursor:pointer;font-family:inherit;border-radius:6px 6px 0 0;
      transition:.2s;display:flex;align-items:center;gap:4px;white-space:nowrap;
      position:relative;
    }
    .sec-tab:hover{color:var(--text);background:rgba(0,0,0,.03)}
    .sec-tab.active{color:var(--text);font-weight:600;background:#fff;box-shadow:0 -1px 4px rgba(0,0,0,.04),0 1px 0 #fff}
    .sec-tab.active::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:3px;border-radius:3px 3px 0 0;background:var(--tab-c,#4A90D9)}
    .sec-tab i{font-size:11px}

    /* ===== BODY ===== */
    .body-layout{flex:1;display:flex;overflow:hidden}

    /* ===== SIDEBAR ===== */
    .sidebar{
      width:var(--sidebar-w);
      background:linear-gradient(180deg,#141e30 0%,#1a2a45 100%);
      display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
      transition:transform .3s;
    }
    .sidebar-scroll{flex:1;overflow-y:auto;padding:6px 0 16px}

    /* Chapter */
    .ch-group{margin-bottom:1px}
    .ch-btn{
      display:flex;align-items:center;gap:6px;
      width:100%;padding:8px 12px 8px 14px;
      border:none;background:transparent;
      color:rgba(255,255,255,.5);
      font-size:12px;font-weight:500;
      cursor:pointer;font-family:inherit;
      text-align:left;transition:.25s;line-height:1.3;
    }
    .ch-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.85)}
    .ch-btn.active{background:rgba(255,255,255,.07);color:#fff}
    .ch-btn .tri{
      font-size:8px;color:rgba(255,255,255,.25);
      transition:transform .3s;flex-shrink:0;width:12px;text-align:center;
    }
    .ch-btn .tri.open{transform:rotate(90deg);color:rgba(255,255,255,.5)}
    .ch-btn .cl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ch-btn .cnt{
      font-size:10px;color:rgba(255,255,255,.25);
      background:rgba(255,255,255,.06);padding:1px 7px;border-radius:8px;flex-shrink:0;
    }

    /* Lessons */
    .lesson-list{overflow:hidden;max-height:0;transition:max-height .35s ease}
    .lesson-list.open{max-height:2000px}

    /* Lesson group */
    .lesson-group{margin-bottom:1px}
    .lesson-top{
      display:flex;align-items:center;gap:6px;
      width:100%;padding:5px 12px 5px 34px;
      border:none;background:transparent;
      color:rgba(255,255,255,.35);
      font-size:11.5px;cursor:pointer;
      font-family:inherit;text-align:left;
      transition:.2s;line-height:1.35;
      border-left:2px solid transparent;
    }
    .lesson-top:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.03)}
    .lesson-top.active{color:#fff;background:rgba(255,255,255,.06);border-left-color:var(--sec-c,#f1c40f)}

    .lesson-top .ltri{
      font-size:7px;color:rgba(255,255,255,.25);
      transition:transform .3s;flex-shrink:0;width:10px;text-align:center;
      visibility:hidden;
    }
    .lesson-top .ltri.show{visibility:visible}
    .lesson-top .ltri.open{transform:rotate(90deg);color:rgba(255,255,255,.5)}
    .lesson-top .llabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lesson-top .lcount{
      font-size:9px;display:flex;gap:3px;flex-shrink:0;
    }
    .lesson-top .lcount span{background:rgba(255,255,255,.06);padding:0 5px;border-radius:3px;color:rgba(255,255,255,.3)}

    /* Source items under lesson */
    .source-list{overflow:hidden;max-height:0;transition:max-height .3s ease}
    .source-list.open{max-height:500px}

    .source-item{
      display:flex;align-items:center;gap:8px;
      width:100%;padding:4px 12px 4px 52px;
      border:none;background:transparent;
      color:rgba(255,255,255,.25);
      font-size:11px;cursor:pointer;
      font-family:inherit;text-align:left;
      transition:.2s;line-height:1.3;
    }
    .source-item:hover{color:rgba(255,255,255,.6);background:rgba(255,255,255,.04)}
    .source-item.active{color:#fff;background:rgba(255,255,255,.06)}
    .source-item .si-icon{font-size:10px;width:16px;text-align:center;flex-shrink:0}
    .source-item .si-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ===== VIEWER ===== */
    .viewer-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .empty-viewer{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:var(--text-muted);gap:10px;
    }
    .empty-viewer i{font-size:60px;opacity:.2}
    .empty-viewer h3{font-size:18px;font-weight:600;color:var(--text)}
    .empty-viewer p{font-size:13px;max-width:360px;text-align:center;line-height:1.5}
    .viewer-panel{display:none;flex-direction:column;height:100%}
    .viewer-panel.open{display:flex}
    .viewer-top{
      display:flex;align-items:center;gap:10px;padding:8px 20px;
      background:#1a1a1a;color:#fff;flex-shrink:0;
    }
    .viewer-top .v-badge{
      font-size:10px;font-weight:600;padding:3px 10px;border-radius:4px;flex-shrink:0;
    }
    .viewer-top h3{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc}
    .viewer-top .v-close{
      background:none;border:none;font-size:17px;cursor:pointer;
      color:#666;padding:2px 6px;border-radius:4px;transition:.2s;
    }
    .viewer-top .v-close:hover{color:#fff;background:rgba(255,255,255,.1)}
    .viewer-container{flex:1;background:#0a0a0a;position:relative}
    .viewer-container iframe{width:100%;height:100%;border:none;display:block;position:absolute;inset:0}

    /* ===== RESPONSIVE ===== */
    @media(max-width:820px){
      .sidebar{position:fixed;z-index:999;height:calc(100vh - 56px);top:56px;left:0;transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0)}
      .sidebar-overlay{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.4);z-index:998}
      .sidebar-overlay.show{display:block}
      .hamburger{display:flex!important}
      .sidebar{width:280px}
      .sec-tab{padding:5px 7px;font-size:10.5px}
    }
    @media(min-width:821px){
      .hamburger{display:none!important}
      .sidebar-overlay{display:none!important}
    }
    .hamburger{
      background:none;border:none;font-size:16px;
      color:var(--text);cursor:pointer;padding:4px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
    }
    .hamburger:hover{background:rgba(0,0,0,.05)}
  </style>
</head>
<body>

  <header class="header">
    <div class="header-main">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <div class="brand">
        <div class="bi"><i class="fas fa-square-root-variable"></i></div>
        <div><h1>Toán <span>Chuyên</span></h1></div>
      </div>
      <div class="sec-tabs" id="secTabs"></div>
    </div>
  </header>

  <div class="body-layout">
    <div class="sidebar-overlay" id="sideOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll" id="sidebarNav"></div>
    </aside>

    <div class="viewer-area" id="viewerArea">
      <div class="empty-viewer" id="emptyViewer">
        <i class="fa-regular fa-hand-pointer"></i>
        <h3>Chọn một bài học</h3>
        <p>Bấm vào tam giác ▶ bên cạnh chương để xem bài học.</p>
      </div>
      <div class="viewer-panel" id="viewerPanel">
        <div class="viewer-top">
          <span class="v-badge" id="vBadge">Bài giảng</span>
          <h3 id="vTitle">Title</h3>
          <button class="v-close" id="vClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="viewer-container">
          <iframe id="vIframe" allowfullscreen loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" title="Video player"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="curriculum.js"></script>
  <script>
  (function(){
    'use strict';

    const S = i => curriculumData[i];
    const C = (s,c) => curriculumData[s]?.chapters[c];

    const state = {
      activeSection: 0,
      openChapters: {},      // key: ci -> true (multiple chapters can be open)
      openLessons: {},       // key: "ci-li" (multiple lessons can have dropdown open)
      activeSource: null,    // {ci, li, src, title, label}
    };

    const secTabs = document.getElementById('secTabs');
    const sidebarNav = document.getElementById('sidebarNav');
    const emptyViewer = document.getElementById('emptyViewer');
    const viewerPanel = document.getElementById('viewerPanel');
    const vBadge = document.getElementById('vBadge');
    const vTitle = document.getElementById('vTitle');
    const vIframe = document.getElementById('vIframe');
    const vClose = document.getElementById('vClose');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sideOverlay');
    const hamburger = document.getElementById('hamburgerBtn');

    // ----- SOURCES -----
    function getSources(lesson){
      const out=[];
      if(lesson.yt) out.push({type:'yt',label:'Bài giảng',icon:'fa-brands fa-youtube',src:`https://www.youtube.com/embed/${lesson.yt}?rel=0`});
      if(lesson.bunny) out.push({type:'bunny',label:'Bài giảng',icon:'fa-solid fa-video',src:`https://iframe.mediadelivery.net/embed/${lesson.bunny}`});
      if(lesson.gd && !lesson.yt && !lesson.bunny) out.push({type:'gd',label:'Tài liệu',icon:'fa-solid fa-file-lines',src:`https://drive.google.com/file/d/${lesson.gd}/preview`});

      if(lesson.related){
        ['yt','yt2','yt3','bunny','gd'].forEach(k=>{
          if(lesson.related[k]){
            const lb=k.startsWith('yt')?'Phần '+((k==='yt'?1:k==='yt2'?2:3)):'Bổ sung';
            const s=k.startsWith('yt')?`https://www.youtube.com/embed/${lesson.related[k]}?rel=0`:
                    k==='bunny'?`https://iframe.mediadelivery.net/embed/${lesson.related[k]}`:
                    `https://drive.google.com/file/d/${lesson.related[k]}/preview`;
            out.push({type:k,label:lb,icon:'fa-solid fa-plus-circle',src:s});
          }
        });
      }

      if(lesson.homework){
        const h=lesson.homework;
        if(h.yt) out.push({type:'hw-yt',label:'BTVN (Video)',icon:'fa-solid fa-pen-to-square',src:`https://www.youtube.com/embed/${h.yt}?rel=0`});
        if(h.yt2) out.push({type:'hw-yt2',label:'BTVN (Video 2)',icon:'fa-solid fa-pen-to-square',src:`https://www.youtube.com/embed/${h.yt2}?rel=0`});
        if(h.yt3) out.push({type:'hw-yt3',label:'BTVN (Video 3)',icon:'fa-solid fa-pen-to-square',src:`https://www.youtube.com/embed/${h.yt3}?rel=0`});
        if(h.gd) out.push({type:'hw-gd',label:'BTVN (Tài liệu)',icon:'fa-solid fa-file-pdf',src:`https://drive.google.com/file/d/${h.gd}/preview`});
        if(h.url) out.push({type:'hw-url',label:'BTVN (Web)',icon:'fa-solid fa-external-link-alt',src:h.url});
      }
      return out;
    }

    function hasBTVN(lesson){
      if(!lesson.homework) return false;
      const h=lesson.homework;
      return !!(h.yt||h.yt2||h.yt3||h.gd||h.url);
    }

    function hasDropdown(lesson){
      const sources=getSources(lesson);
      return sources.length>1;
    }

    function isLessonOpen(ci, li){
      return !!state.openLessons[ci+'-'+li];
    }

    function isChapterOpen(ci){
      return !!state.openChapters[ci];
    }

    // ----- RENDER TABS -----
    function renderTabs(){
      let html='';
      curriculumData.forEach((sec,i)=>{
        const a=i===state.activeSection;
        html+=`<button class="sec-tab ${a?'active':''}" data-si="${i}" style="${a?`--tab-c:${sec.color}`:''}">
          <i class="fa-solid ${sec.icon}" style="color:${sec.color}"></i> ${sec.section}
        </button>`;
      });
      secTabs.innerHTML=html;
      secTabs.querySelectorAll('.sec-tab').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const si=parseInt(btn.dataset.si);
          if(si!==state.activeSection){
            state.activeSection=si;
            state.openChapters={};
            state.openLessons={};
            state.activeSource=null;
            renderTabs();
            renderNav();
            closeViewer();
          }
        });
      });
    }

    // ----- RENDER NAV -----
    function renderNav(){
      const sec=S(state.activeSection);
      if(!sec){sidebarNav.innerHTML='';return}

      let html='';
      sec.chapters.forEach((ch,ci)=>{
        const openCh=isChapterOpen(ci);
        html+=`<div class="ch-group">`;
        html+=`<button class="ch-btn ${openCh?'active':''}" data-ci="${ci}">
          <span class="tri ${openCh?'open':''}">▶</span>
          <span class="cl">${ch.title}</span>
          <span class="cnt">${ch.lessons.length}</span>
        </button>`;
        html+=`<div class="lesson-list ${openCh?'open':''}">`;

        ch.lessons.forEach((lesson,li)=>{
          const isOpen=isLessonOpen(ci, li);
          const sources=getSources(lesson);
          const mainSrcs=sources.filter(s=>!s.type.startsWith('hw-'));
          const hwSrcs=sources.filter(s=>s.type.startsWith('hw-'));
          const hasHW=hwSrcs.length>0;
          const hasDD=hasDropdown(lesson);
          const isActive=state.activeSource && state.activeSource.ci===ci && state.activeSource.li===li;

          html+=`<div class="lesson-group">`;
          html+=`<button class="lesson-top ${isActive?'active':''}" data-ci="${ci}" data-li="${li}" style="${isActive?`--sec-c:${sec.color}`:''}">
            <span class="ltri ${hasDD?'show':''} ${isOpen?'open':''}">▶</span>
            <span class="llabel">${lesson.title}</span>
            <span class="lcount">${hasHW?`<span style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)">BTVN</span>`:''}</span>
          </button>`;

          // Source list (dropdown)
          html+=`<div class="source-list ${isOpen?'open':''}">`;

          // Main sources
          mainSrcs.forEach(src=>{
            const act=state.activeSource && state.activeSource.ci===ci && state.activeSource.li===li && state.activeSource.src===src.src;
            let iconColor='#888';
            if(src.type==='yt') iconColor='#c62828';
            else if(src.type==='bunny') iconColor='#1565c0';
            else if(src.type==='gd') iconColor='#2e7d32';

            html+=`<button class="source-item ${act?'active':''}" data-ci="${ci}" data-li="${li}" data-src="${src.src}" data-label="${src.label}" data-title="${lesson.title}">
              <i class="${src.icon} si-icon" style="color:${iconColor}"></i>
              <span class="si-label">${src.label}</span>
            </button>`;
          });

          // HW items
          hwSrcs.forEach(src=>{
            const act=state.activeSource && state.activeSource.ci===ci && state.activeSource.li===li && state.activeSource.src===src.src;
            html+=`<button class="source-item ${act?'active':''}" data-ci="${ci}" data-li="${li}" data-src="${src.src}" data-label="${src.label}" data-title="${lesson.title}">
              <i class="${src.icon} si-icon" style="color:#7b1fa2"></i>
              <span class="si-label">${src.label}</span>
            </button>`;
          });

          html+=`</div>`; // source-list
          html+=`</div>`; // lesson-group
        });

        html+=`</div>`; // lesson-list
        html+=`</div>`; // ch-group
      });
      sidebarNav.innerHTML=html;

      // Chapter click - toggle, multiple chapters can stay open
      sidebarNav.querySelectorAll('.ch-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const ci=parseInt(btn.dataset.ci);
          if(state.openChapters[ci]){
            delete state.openChapters[ci];
          } else {
            state.openChapters[ci]=true;
          }
          renderNav();
        });
      });

      // Lesson click — toggle dropdown
      sidebarNav.querySelectorAll('.lesson-top').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const ci=parseInt(btn.dataset.ci);
          const li=parseInt(btn.dataset.li);
          const key=ci+'-'+li;
          const lesson=C(state.activeSection,ci).lessons[li];
          const sources=getSources(lesson);
          const hasDD=hasDropdown(lesson);

          if(hasDD){
            if(state.openLessons[key]){
              delete state.openLessons[key];
            } else {
              state.openLessons[key]=true;
            }
            renderNav();
          } else {
            if(sources.length>0){
              state.openChapters[ci]=true;
              state.activeSource={ci,li,src:sources[0].src,title:lesson.title,label:sources[0].label};
              openSource(sources[0],lesson.title);
              renderNav();
              closeMobileSidebar();
            }
          }
        });
      });

      // Source item click
      sidebarNav.querySelectorAll('.source-item').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const ci=parseInt(btn.dataset.ci);
          const li=parseInt(btn.dataset.li);
          const srcStr=btn.dataset.src;
          const label=btn.dataset.label;
          const title=btn.dataset.title;
          const sources=getSources(C(state.activeSection,ci).lessons[li]);
          const matchedSrc=sources.find(s=>s.src===srcStr)||{src:srcStr,label,icon:'fa-solid fa-file'};

          state.openChapters[ci]=true;
          state.activeSource={ci,li,src:matchedSrc.src,title,label};
          openSource(matchedSrc,title);
          renderNav();
          closeMobileSidebar();
        });
      });

      // Auto-scroll
      const actEl=sidebarNav.querySelector('.lesson-top.active, .source-item.active');
      if(actEl) setTimeout(()=>actEl.scrollIntoView({block:'nearest',behavior:'smooth'}),60);
    }

    // ----- OPEN SOURCE -----
    function openSource(src,title){
      emptyViewer.style.display='none';
      viewerPanel.classList.add('open');

      let badgeColor='#4A90D9';
      if(src.type==='yt'||src.type.startsWith('yt')) badgeColor='#c62828';
      else if(src.type==='gd'||src.type.startsWith('gd')) badgeColor='#2e7d32';
      else if(src.type==='bunny') badgeColor='#1565c0';
      else if(src.type==='url') badgeColor='#e65100';
      else if(src.type&&src.type.startsWith('hw')) badgeColor='#7b1fa2';

      vBadge.textContent=src.label;
      vBadge.style.background=badgeColor+'22';
      vBadge.style.color=badgeColor;
      vTitle.textContent=title;
      vIframe.src=src.src;
    }

    // ----- CLOSE -----
    function closeViewer(){
      state.activeSource=null;
      emptyViewer.style.display='flex';
      viewerPanel.classList.remove('open');
      vIframe.src='';
    }

    vClose.addEventListener('click',closeViewer);
    document.addEventListener('keydown',(e)=>{
      if(e.key==='Escape' && state.activeSource) closeViewer();
    });

    // ----- SIDEBAR TOGGLE -----
    function closeMobileSidebar(){
      if(window.innerWidth<=820){sidebar.classList.remove('open');overlay.classList.remove('show')}
    }
    hamburger.addEventListener('click',()=>{
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click',closeMobileSidebar);

    // ----- INIT -----
    renderTabs();
    state.openChapters[0]=true;
    renderNav();

  })();
  </script>
</body>
</html>
